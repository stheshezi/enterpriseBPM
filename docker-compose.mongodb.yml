version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: enterprise-bpm-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: enterprise_bpm
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise-bpm-network

volumes:
  mongodb-data:
  mongodb-config:

networks:
  enterprise-bpm-network:
    driver: bridge
