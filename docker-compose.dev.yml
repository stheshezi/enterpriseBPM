version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-bpm-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_bpm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise-bpm-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-bpm-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/enterprise_bpm?schema=public
      NEXTAUTH_SECRET: dev-secret-key-change-me
      NEXTAUTH_URL: http://localhost:3000
      SUPER_ADMIN_EMAIL: admin@example.com
      SUPER_ADMIN_PASSWORD: ChangeMe123!
      SUPER_ADMIN_TENANT_DOMAIN: admin
      SEED_DB: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - enterprise-bpm-network

volumes:
  postgres-data-dev:

networks:
  enterprise-bpm-network:
    driver: bridge
